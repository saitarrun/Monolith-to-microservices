# =============================================================================
# User Service – Kubernetes Deployment + Service
# =============================================================================
# Extracted from monolith as part of the Strangler Fig migration (Phase 3).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-svc
  labels:
    app: user-svc
    version: v1
    strangler-fig/phase: "3"
spec:
  replicas: {{ .Values.users.replicas }}
  selector:
    matchLabels:
      app: user-svc
  template:
    metadata:
      labels:
        app: user-svc
        version: v1
    spec:
      containers:
        - name: user-svc
          image: {{ .Values.users.image }}
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: url
            - name: PORT
              value: "8002"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-svc
  labels:
    app: user-svc
spec:
  selector:
    app: user-svc
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8002
