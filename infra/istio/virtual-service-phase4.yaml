# =============================================================================
# Phase 4 VirtualService – User Traffic → User Service
# =============================================================================
# Routes /api/users/* requests to the new user-service microservice.
# Everything else still goes to the monolith.
# Orders traffic continues to go to orders-svc via /api/v2/orders.
#
# Strangler Fig Phase: 4 (Route to New Service)
# =============================================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: strangler-fig-routing
  namespace: default
  labels:
    app.kubernetes.io/part-of: strangler-fig-migration
    strangler-fig/phase: "4"
  annotations:
    description: "Phase 4 – User traffic routed to user-service, rest to monolith"
spec:
  hosts:
    - "*"
  gateways:
    - strangler-fig-gateway
  http:
    # -------------------------------------------------------
    # User endpoints → New User Microservice (100%)
    # -------------------------------------------------------
    - match:
        - uri:
            prefix: /api/users
      route:
        - destination:
            host: user-svc
            port:
              number: 80
          weight: 100

    # -------------------------------------------------------
    # Orders v2 → Orders Microservice (already extracted)
    # -------------------------------------------------------
    - match:
        - uri:
            prefix: /api/v2/orders
      route:
        - destination:
            host: orders-svc
            port:
              number: 80
          weight: 100

    # -------------------------------------------------------
    # Catch-all → Monolith (legacy)
    # -------------------------------------------------------
    - route:
        - destination:
            host: monolith
            port:
              number: 80
          weight: 100
