# =============================================================================
# Phase 5b – Canary 50% User Traffic → User Service
# =============================================================================
# Half of /api/users traffic now goes to the new user-service.
# Use Kiali/Grafana to compare error rates and latency.
#
# Strangler Fig Phase: 5 (Canary at 50%)
# =============================================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: strangler-fig-routing
  namespace: default
  labels:
    app.kubernetes.io/part-of: strangler-fig-migration
    strangler-fig/phase: "5-canary-50"
  annotations:
    description: "Phase 5 – Canary: 50% user traffic to user-service"
spec:
  hosts:
    - "*"
  gateways:
    - strangler-fig-gateway
  http:
    # -------------------------------------------------------
    # User endpoints – 50/50 canary split
    # -------------------------------------------------------
    - match:
        - uri:
            prefix: /api/users
      route:
        - destination:
            host: user-svc
            port:
              number: 80
          weight: 50
        - destination:
            host: monolith
            port:
              number: 80
          weight: 50

    # -------------------------------------------------------
    # Orders v2 → Orders Microservice
    # -------------------------------------------------------
    - match:
        - uri:
            prefix: /api/v2/orders
      route:
        - destination:
            host: orders-svc
            port:
              number: 80
          weight: 100

    # -------------------------------------------------------
    # Catch-all → Monolith
    # -------------------------------------------------------
    - route:
        - destination:
            host: monolith
            port:
              number: 80
          weight: 100
