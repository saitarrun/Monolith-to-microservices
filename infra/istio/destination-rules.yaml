# =============================================================================
# Istio DestinationRules – Circuit Breaking & Retry Policies
# =============================================================================
# These rules protect the mesh during the Strangler Fig migration by:
#   1. Limiting concurrent connections to prevent cascading failures
#   2. Enabling automatic retries for transient errors
#   3. Ejecting unhealthy endpoints from the load balancer
# =============================================================================

# -------------------------------------------------------
# User Service – DestinationRule
# -------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: user-svc-destination
  namespace: default
  labels:
    app.kubernetes.io/part-of: strangler-fig-migration
spec:
  host: user-svc
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: DEFAULT
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    retryPolicy:
      retryOn: 5xx,reset,connect-failure
      numRetries: 3
      perTryTimeout: 5s

---
# -------------------------------------------------------
# Monolith – DestinationRule
# -------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: monolith-destination
  namespace: default
  labels:
    app.kubernetes.io/part-of: strangler-fig-migration
spec:
  host: monolith
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        h2UpgradePolicy: DEFAULT
        http1MaxPendingRequests: 200
        http2MaxRequests: 2000
        maxRequestsPerConnection: 20
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 30

---
